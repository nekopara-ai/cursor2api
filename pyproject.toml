[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor2api"
version = "0.3.0"
description = "Experimental local Anthropic and OpenAI facade for Cursor's agent protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "Star Required Public Source License 1.0" }
authors = [{ name = "nekopara-ai" }]
keywords = [
  "cursor", "anthropic", "openai", "llm-proxy", "api-gateway",
  "http2", "connect-rpc",
]
dependencies = ["h2>=4.1.0,<5"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: Other/Proprietary License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/nekopara-ai/cursor2api"
Documentation = "https://github.com/nekopara-ai/cursor2api#documentation"
Issues = "https://github.com/nekopara-ai/cursor2api/issues"
Source = "https://github.com/nekopara-ai/cursor2api"

[project.scripts]
cursor2api = "cursor2api.__main__:main"

[tool.setuptools]
packages = ["cursor2api"]
