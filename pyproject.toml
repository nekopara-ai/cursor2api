[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cursor2api"
version = "0.2.0"
description = "Anthropic Messages and OpenAI Chat Completions APIs in front of Cursor's agent protocol"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "nekopara-ai" }]
keywords = [
  "cursor", "anthropic", "openai", "llm-proxy", "connect-rpc",
  "claude", "grok", "reverse-engineering",
]
dependencies = ["h2>=4.1.0,<5"]
classifiers = [
  "Development Status :: 4 - Beta",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Internet :: WWW/HTTP :: HTTP Servers",
]

[project.urls]
Homepage = "https://github.com/nekopara-ai/cursor2api"
Issues = "https://github.com/nekopara-ai/cursor2api/issues"

[project.scripts]
cursor2api = "cursor2api.__main__:main"

[tool.setuptools]
packages = ["cursor2api"]
